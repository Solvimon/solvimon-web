name: Create Release Tag

on:
    push:
        branches:
            - main
        paths:
            - package.json
    workflow_dispatch:
        inputs:
            version:
                description: Version to release. Defaults to the one in package.json.
                required: false
                type: string

permissions:
    contents: write

jobs:
    version:
        name: Check version
        # A dispatch can name any ref, and the release job publishes to npm irreversibly.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            changed: ${{ steps.version.outputs.changed }}
            current: ${{ steps.version.outputs.current }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            # A push compares against what it replaced. A manual run has no such commit —
            # `github.event.before` is empty there — so it asks the tags what is already released,
            # which is what makes re-running after a failed publish do something.
            - name: Check package version change
              id: version
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
                  BEFORE_SHA: ${{ github.event.before }}
              run: |
                  package_version=$(node -p "require('./package.json').version")
                  current_version="${REQUESTED_VERSION:-$package_version}"

                  if [ "$current_version" != "$package_version" ]; then
                      echo "Requested $current_version but package.json is at $package_version."
                      exit 1
                  fi

                  echo "current=$current_version" >> "$GITHUB_OUTPUT"

                  if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA:package.json" 2> /dev/null; then
                      previous_version=$(git show "$BEFORE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                      echo "previous=$previous_version" >> "$GITHUB_OUTPUT"

                      if [ "$current_version" = "$previous_version" ]; then
                          echo "changed=false" >> "$GITHUB_OUTPUT"
                          echo "package.json version did not change; skipping tag creation."
                          exit 0
                      fi

                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      echo "package.json version changed from $previous_version to $current_version."
                      exit 0
                  fi

                  if git ls-remote --exit-code --tags origin "refs/tags/v$current_version" > /dev/null 2>&1; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                      echo "v$current_version is already tagged; skipping tag creation."
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                      echo "v$current_version is not tagged yet; releasing it."
                  fi

            - name: Check changelog
              if: steps.version.outputs.changed == 'true'
              run: npm run changelog:check

            - name: Check tag does not exist
              if: steps.version.outputs.changed == 'true'
              run: |
                  tag_name="v${{ steps.version.outputs.current }}"

                  if git ls-remote --exit-code --tags origin "refs/tags/$tag_name" > /dev/null 2>&1; then
                      echo "Tag $tag_name already exists."
                      exit 1
                  fi

    create-release-tag:
        name: Create release tag
        needs: version
        if: needs.version.outputs.changed == 'true'
        # Waits for a reviewer's approval before anything below runs.
        environment: npm
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org/

            - name: Authenticate GitLab npm registry
              run: npm config set //gitlab.com/api/v4/projects/38958827/packages/npm/:_authToken ${{ secrets.GITLAB_NPM_TOKEN }}

            - name: Install dependencies
              run: npm ci
              env:
                  GITLAB_NPM_TOKEN: ${{ secrets.GITLAB_NPM_TOKEN }}

            # Skipped when the registry already has it: the failure a manual re-run exists for is a
            # publish that went through and a tag that did not, and npm answers a second publish of
            # the same version with a 403 that would stop the run before it tags.
            - name: Check whether the version is already published
              id: published
              run: |
                  version="${{ needs.version.outputs.current }}"
                  package=$(node -p "require('./package.json').name")

                  if npm view "$package@$version" version > /dev/null 2>&1; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "$package@$version is already on npm; tagging it without publishing."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # npm 11 refuses a prerelease without a tag, and `latest` is what a plain install gets, so
            # only a stable version goes there.
            - name: Publish to npm
              if: steps.published.outputs.exists != 'true'
              run: |
                  npm config delete --location project @solvimon:registry
                  case "${VERSION%%+*}" in
                      *-*) dist_tag=next ;;
                      *) dist_tag=latest ;;
                  esac
                  npm publish --tag "$dist_tag"
              env:
                  VERSION: ${{ needs.version.outputs.current }}
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # Tagged only once the publish has gone through: a tag pointing at a version
            # that never reached the registry is what the release has to be dug out of by
            # hand, and `gh release create --verify-tag` below would cut a release from it.
            - name: Create release tag
              run: |
                  tag_name="v${{ needs.version.outputs.current }}"

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$tag_name" -m "Release $tag_name"
                  git push origin "refs/tags/$tag_name"

            - name: Extract changelog section
              id: changelog
              run: |
                  version="${{ needs.version.outputs.current }}"
                  notes=$(node ./scripts/ci/changelog-section.mjs "$version")
                  echo "notes<<EOF" >> "$GITHUB_OUTPUT"
                  echo "$notes" >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_NOTES: ${{ steps.changelog.outputs.notes }}
              run: |
                  gh release create "v${{ needs.version.outputs.current }}" \
                    --title "v${{ needs.version.outputs.current }}" \
                    --notes "$RELEASE_NOTES" \
                    --verify-tag
